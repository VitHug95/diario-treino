# Configuração do Netlify para o app web (Flutter) do Diário de Treino.
# "base" é a pasta app/.
#
# A imagem do Netlify NÃO traz o Flutter. Por isso o build clona o SDK do
# Flutter na versão fixa (a mesma do CI: 3.29.3) e usa esse binário para
# compilar. O clone fica em $HOME/flutter, fora da pasta publicada.
#
# A URL da API vem da variável de ambiente API_BASE_URL (defina no painel do
# Netlify: Site settings > Environment variables). Se não estiver definida,
# cai no fallback da URL do Fly. Após publicar o front, confirme que essa URL
# bate com Cors__OrigensPermitidas__0 no Fly (senão o navegador bloqueia CORS).

[build]
  base = "app"
  publish = "build/web"
  command = """
    FLUTTER_VERSION=3.29.3
    if [ ! -d "$HOME/flutter" ]; then \
      git clone --depth 1 --branch $FLUTTER_VERSION https://github.com/flutter/flutter.git $HOME/flutter; \
    fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter --version
    flutter pub get
    flutter build web --release --dart-define=API_BASE_URL=${API_BASE_URL:-https://diario-treino-api.fly.dev/api/v1}
  """

[build.environment]
  # Evita o aviso de "dubious ownership" do git no SDK clonado em CI.
  FLUTTER_GIT_URL = "https://github.com/flutter/flutter.git"

# SPA: qualquer rota cai no index.html (go_router cuida do resto).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
