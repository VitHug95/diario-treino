name: diario_treino
description: "Diário de Treino — registra treinos e acompanha a evolução."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  dio: ^5.11.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  # Fixado em 1.0.0: a 1.1.0 usa Matrix4.translateByDouble/scaleByDouble, que só
  # existem no vector_math do Flutter 3.32+. Este projeto (e o CI) está no 3.29.3.
  fl_chart: 1.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  lucide_icons: ^0.257.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
