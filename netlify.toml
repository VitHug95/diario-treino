# Configuração do Netlify na RAIZ do repositório.
#
# O Netlify lê a config a partir da raiz do repo. Com base = "app", ele entra
# na pasta app/ antes de buildar, e publish/command passam a ser relativos a
# ela. Isso garante que o build do Flutter rode mesmo quando o painel do
# Netlify está configurado para publicar "from /".
#
# A imagem do Netlify NÃO traz o Flutter: o build clona o SDK na versão fixa
# (a mesma do CI: 3.29.3) e compila com esse binário. O clone fica em
# $HOME/flutter, fora da pasta publicada.
#
# A URL da API vem da variável de ambiente API_BASE_URL (painel do Netlify:
# Environment variables). Sem ela, cai no fallback da URL do Fly. Essa URL
# precisa bater com Cors__OrigensPermitidas__0 no Fly (senão o navegador
# bloqueia por CORS).
#
# A flag TREINO_AO_VIVO (épico pós-MVP, Release 2) é ligada FIXA no build via
# --dart-define=TREINO_AO_VIVO=true. É fixa de propósito: um valor literal não
# depende de env var do painel do Netlify (um TREINO_AO_VIVO=false configurado
# lá venceria um default `${VAR:-true}` e manteria o Release 2 fora do bundle).
# Para desligar, troque para "false" aqui e faça commit.

[build]
  base = "app"
  publish = "build/web"
  command = """
    FLUTTER_VERSION=3.29.3
    if [ ! -d "$HOME/flutter" ]; then \
      git clone --depth 1 --branch $FLUTTER_VERSION https://github.com/flutter/flutter.git $HOME/flutter; \
    fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter --version
    flutter pub get
    flutter build web --release \
      --dart-define=API_BASE_URL=${API_BASE_URL:-https://diario-treino-api.fly.dev/api/v1} \
      --dart-define=TREINO_AO_VIVO=true
  """

[build.environment]
  # Evita o aviso de "dubious ownership" do git no SDK clonado em CI.
  FLUTTER_GIT_URL = "https://github.com/flutter/flutter.git"

# SPA: qualquer rota cai no index.html (go_router cuida do resto).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache: o "shell" do app (HTML + bootstrap + service worker) nunca é cacheado,
# para um deploy novo aparecer na hora, sem o usuário precisar limpar o
# navegador. Os assets com hash no nome podem ser cacheados à vontade (o nome
# muda a cada build). Isto evita a classe de bug "deployei e a tela não mudou".
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
