# fly.toml app configuration file generated for diario-treino-api on 2026-10-12T17:53:48-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'diario-treino-api'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'
  ASPNETCORE_HTTP_PORTS = '8080'
  # PBI-106: o modo educador exige o registro do CREF (número, UF e foto).
  # Educador sem registro fica travado; o Vinicius entra pelo script do legado
  # (docs/scripts/habilitar-educador-legado.sql). Para desligar, 'false'.
  Educador__ExigirCref = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
