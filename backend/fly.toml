# Configuração do Fly.io para a API Diário de Treino.
# Rode a partir da pasta backend/. Ajuste "app" para um nome único no Fly
# (ex.: diario-treino-api). A região "gru" é São Paulo.
#
# Segredos NÃO vão aqui — são definidos com `fly secrets set` (ver docs/PENDENCIAS-PUBLICACAO.md):
#   ConnectionStrings__DiarioTreino, Cors__OrigensPermitidas__0, Firebase__ProjectId

app = "diario-treino-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_HTTP_PORTS = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
