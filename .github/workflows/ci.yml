name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore DiarioTreino.slnx

      - name: Build (sem warnings — TreatWarningsAsErrors)
        run: dotnet build DiarioTreino.slnx --configuration Release --no-restore

      # O runner ubuntu-latest tem Docker, então o Testcontainers sobe o
      # Postgres real para os testes de integração.
      - name: Testes unitários e de integração
        run: dotnet test DiarioTreino.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Front-end (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes de widget
        # A flag TREINO_AO_VIVO é `true` por padrão (fluxo novo em produção).
        # O teste de fluxo (fluxo_registro_test) foi escrito para o fluxo antigo
        # de registro, então rodamos a suíte com a flag desligada. O fluxo novo
        # tem cobertura própria (controller, widgets, resumo, iniciar/retomar).
        run: flutter test --dart-define=TREINO_AO_VIVO=false

      - name: Build web
        run: flutter build web --release

  # E2E do fluxo principal (PBI-26) contra uma stack efêmera no próprio runner:
  # Postgres (service) + Firebase Auth Emulator + API .NET + Flutter.
  #
  # O teste roda com integration_test (flutter drive + ChromeDriver), não mais
  # Robot/Playwright: o Flutter web usa CanvasKit (o renderer HTML foi removido
  # no 3.29) e os campos de texto não aceitam entrada via DOM de forma
  # confiável, o que inviabilizava preencher o cadastro/série pelo navegador.
  # O integration_test digita pela árvore de widgets (tester.enterText). O app
  # entra já autenticado pelo atalho de login do boot (main.dart, modo emulador).
  #
  # Bloqueante: a suíte amadureceu (verde e estável), então o E2E passou a
  # barrar o merge. Para absorver flake transitório (timeout de boot do
  # emulador/API, lentidão do ChromeDriver) sem travar merge à toa, o passo do
  # `flutter drive` re-tenta uma vez antes de falhar.
  e2e:
    name: E2E (integration_test + Chrome)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      PROJECT_ID: demo-diario-treino
      API_PORT: "8080"
      AUTH_EMULATOR_PORT: "9099"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diariotreino
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Configurar Java (para o Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Chrome + ChromeDriver: usa os que o runner ubuntu já traz, casados por
      # construção (o Chrome fica em /opt/google/chrome e o ChromeDriver em
      # $CHROMEWEBDRIVER, na mesma versão). Tentar instalar outro Chrome/driver
      # (Chrome for Testing) causava mismatch de major — o flutter drive insiste
      # no Chrome do sistema. Aqui só confirmamos as versões no log.
      - name: Conferir Chrome + ChromeDriver do runner
        run: |
          echo "Chrome:       $(google-chrome --version 2>/dev/null || /opt/google/chrome/chrome --version)"
          echo "CHROMEWEBDRIVER=$CHROMEWEBDRIVER"
          echo "ChromeDriver: $($CHROMEWEBDRIVER/chromedriver --version)"
      # --- Firebase Auth Emulator ---
      - name: Instalar firebase-tools
        run: npm install -g firebase-tools
      - name: Subir o Auth Emulator (background)
        working-directory: e2e
        run: |
          firebase emulators:start --only auth --project "$PROJECT_ID" > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "Aguardando o Auth Emulator na porta $AUTH_EMULATOR_PORT..."
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${AUTH_EMULATOR_PORT}/" > /dev/null; then
              echo "Emulator no ar."; ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::Auth Emulator não subiu em 60s"; cat "$RUNNER_TEMP/emulator.log"; exit 1
          fi
      # --- API .NET apontada ao Postgres e ao emulador ---
      - name: Build da API
        working-directory: backend
        run: dotnet build DiarioTreino.slnx --configuration Release
      - name: Subir a API (background)
        working-directory: backend
        env:
          ASPNETCORE_URLS: "http://127.0.0.1:8080"
          ASPNETCORE_ENVIRONMENT: Production
          CONNECTIONSTRINGS__DIARIOTREINO: "Host=127.0.0.1;Port=5432;Database=diariotreino;Username=postgres;Password=postgres"
          BANCO__APLICARMIGRACOESNOSTARTUP: "true"
          FIREBASE__PROJECTID: demo-diario-treino
          FIREBASE__AUTHEMULATORHOST: "127.0.0.1:9099"
          FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
          # NÃO fixar Cors:OrigensPermitidas no E2E: o flutter drive (web-server)
          # serve o app numa porta ALEATÓRIA em localhost. Sem lista fixa e com o
          # modo emulador ligado (FIREBASE__AUTHEMULATORHOST), a API libera
          # qualquer localhost no CORS (ver Program.cs). Com a lista fixa :8000,
          # o GET real era bloqueado pelo navegador (só o preflight OPTIONS
          # passava), e a Início caía em "Não foi possível carregar suas fichas".
        run: |
          # --no-launch-profile: ignora o launchSettings.json (que fixa a porta
          # 5289 e o ambiente Development) e respeita as variáveis acima.
          dotnet run --project src/DiarioTreino.Api --configuration Release --no-build --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "Aguardando a API em /health..."
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${API_PORT}/health" > /dev/null; then
              echo "API no ar."; ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::A API não respondeu em /health em 90s"; cat "$RUNNER_TEMP/api.log"; exit 1
          fi
      # --- integration_test via flutter drive + ChromeDriver ---
      - name: ChromeDriver (background)
        run: |
          # ChromeDriver do runner, casado com o Chrome do sistema.
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4444/status" > /dev/null; then
              echo "ChromeDriver no ar."; ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::ChromeDriver não subiu em 30s"; cat "$RUNNER_TEMP/chromedriver.log"; exit 1
          fi
      - name: Rodar o E2E (integration_test)
        working-directory: app
        timeout-minutes: 12
        run: |
          # firebase_options.dart é gitignored (um por ambiente); usa o de E2E.
          cp lib/firebase_options.e2e.dart lib/firebase_options.dart
          flutter pub get
          # tee + pipefail: o stdout do teste (inclui o diagnóstico "Textos
          # visíveis na tela" em falha) vai para o console E para drive.log, que
          # é publicado no artefato — assim a falha é inspecionável sem precisar
          # copiar o log do job. O exit code é o do flutter drive, não do tee.
          set -o pipefail
          rodar_drive() {
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/fluxo_pbi26_test.dart \
              -d web-server \
              --browser-name=chrome \
              --headless \
              --dart-define=API_BASE_URL=http://127.0.0.1:8080/api/v1 \
              --dart-define=TREINO_AO_VIVO=false \
              --dart-define=USE_AUTH_EMULATOR=true \
              --dart-define=AUTH_EMULATOR_HOST=127.0.0.1 \
              --dart-define=AUTH_EMULATOR_PORT=9099 \
              2>&1 | tee -a "$RUNNER_TEMP/drive.log"
          }
          # Bloqueante com 1 retry: um flake transitório (boot do emulador/API,
          # ChromeDriver lento) não trava o merge; falha de verdade reprova nas
          # duas tentativas. O drive.log acumula as duas (tee -a) no artefato.
          if ! rodar_drive; then
            echo "::warning::E2E falhou na 1ª tentativa; repetindo uma vez."
            echo "===== RETRY DO E2E =====" >> "$RUNNER_TEMP/drive.log"
            rodar_drive
          fi
      - name: Logs dos serviços (diagnóstico em falha)
        if: failure()
        run: |
          echo "===== API ====="; tail -n 200 "$RUNNER_TEMP/api.log" 2>/dev/null || true
          echo "===== EMULATOR ====="; tail -n 100 "$RUNNER_TEMP/emulator.log" 2>/dev/null || true
          echo "===== CHROMEDRIVER ====="; tail -n 50 "$RUNNER_TEMP/chromedriver.log" 2>/dev/null || true
      - name: Publicar logs dos serviços
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: |
            ${{ runner.temp }}/drive.log
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/chromedriver.log
          if-no-files-found: ignore

  # Publica o front (Flutter web) no Cloudflare (Workers Static Assets) SOMENTE
  # depois do CI passar e apenas em merge na main. O build roda aqui (ambiente
  # que já tem Flutter) e o `wrangler deploy` sobe o build/web para o Worker
  # "diario-treino" (ver app/wrangler.toml). Trocou o Netlify, cujo plano Free
  # pausava os deploys ao fim dos créditos do mês.
  #
  # Secrets necessários (Settings > Secrets and variables > Actions):
  #   CLOUDFLARE_API_TOKEN   — token com permissão de editar Workers
  #   CLOUDFLARE_ACCOUNT_ID  — id da conta Cloudflare
  deploy-web:
    name: Deploy Web (Cloudflare)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Baixar dependências
        run: flutter pub get
        working-directory: app

      - name: Build web (produção)
        working-directory: app
        run: >
          flutter build web --release
          --dart-define=API_BASE_URL=https://diario-treino-api.fly.dev/api/v1

      - name: Publicar no Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: deploy

  # Publica a API no Fly SOMENTE depois do CI passar e apenas em merge na main.
  # Requer o secret FLY_API_TOKEN no repositório.
  deploy-api:
    name: Deploy API (Fly.io)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --ha=false: mantém UMA máquina. Sem a flag, o Fly tenta subir uma 2ª
      # máquina para alta disponibilidade e o deploy fica vermelho quando a
      # região (gru) está sem capacidade ("no capacity in gru") — mesmo com a
      # API já no ar na 1ª máquina. Uso pessoal não precisa de HA; se um dia
      # precisar, escalar com `fly scale count 2` fora do deploy.
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
